{% extends 'base.html' %}

{% block title %}Enviar solicitação - Gerenciador de Tarefas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="mb-4">
            <h1 class="h2 mb-1">Enviar solicitação de contato</h1>
            <p class="text-secondary mb-0">
                Procure uma pessoa pelo e-mail ou nome de usuário.
            </p>
        </div>

        <form method="post" class="cartao">
            <div class="mb-4">
                <label class="form-label" for="identificador">E-mail ou nome de usuário</label>
                <input
                    class="form-control"
                    id="identificador"
                    name="identificador"
                    type="text"
                    maxlength="254"
                    autocomplete="off"
                    placeholder="exemplo@email.com ou nomeUsuario"
                    required
                    autofocus
                >
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-principal" type="submit">Enviar solicitação</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('lista_contatos') }}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
