{% extends 'base.html' %}{% from '_macros.html' import csrf with context %}{% block title %}Contato · Taskdorah{% endblock %}{% block content %}<div class="cabecalho"><h1>{{ 'Editar contato' if edicao else 'Novo contato' }}</h1></div><form method="post" class="cartao formulario">{{ csrf() }}<label for="nome">Nome *</label><input id="nome" name="nome" class="form-control" value="{{ contato.nome }}" required maxlength="120"><label for="email">E-mail</label><input type="email" id="email" name="email" class="form-control" value="{{ contato.email }}" maxlength="254"><label for="telefone">Telefone</label><input type="tel" id="telefone" name="telefone" class="form-control" value="{{ contato.telefone }}" maxlength="30"><div class="botoes"><button class="btn btn-principal">Salvar contato</button><a class="btn" href="{{ url_for('lista_contatos') }}">Cancelar</a></div></form>{% endblock %}
